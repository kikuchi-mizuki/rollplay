version: "1.0"

evaluation_criteria:
  - id: "questioning_skill"
    name: "質問力"
    description: "顧客のニーズ・課題を適切に引き出す質問"
    levels:
      - score: 1
        label: "質問なし"
        description: "質問が見られない"
      - score: 2
        label: "一般的な質問のみ"
        description: "形式的な質問のみ"
      - score: 3
        label: "状況に応じた質問"
        description: "会話の流れに沿った質問"
      - score: 4
        label: "深掘り質問あり"
        description: "課題を掘り下げる質問"
      - score: 5
        label: "核心を的確に把握"
        description: "顧客の真の課題を引き出す質問"
  
  - id: "listening_skill"
    name: "傾聴力"
    description: "相手の発言を理解し、適切に受容・共感"
    levels:
      - score: 1
        label: "話を聞いていない"
        description: "聞いている姿勢が見られない"
      - score: 2
        label: "表面的な理解"
        description: "言葉のみを理解"
      - score: 3
        label: "内容を理解している"
        description: "内容を把握している"
      - score: 4
        label: "共感・確認を示している"
        description: "相槌や確認で共感を示す"
      - score: 5
        label: "背景まで理解して対応"
        description: "背景・感情まで理解して適切に対応"

  - id: "proposal_skill"
    name: "提案力"
    description: "顧客の課題に対する具体的な解決策を提示"
    levels:
      - score: 1
        label: "提案なし"
        description: "具体的な提案が見られない"
      - score: 2
        label: "抽象的提案"
        description: "曖昧な提案"
      - score: 3
        label: "一般的な提案"
        description: "汎用的な提案"
      - score: 4
        label: "具体的な提案"
        description: "具体的な解決策を提示"
      - score: 5
        label: "顧客固有のニーズに最適化"
        description: "顧客の課題に最適化された提案"

  - id: "closing_skill"
    name: "クロージング力"
    description: "次のアクション・決定を促す適切なクロージング"
    levels:
      - score: 1
        label: "クロージングなし"
        description: "次のアクションへの誘導がない"
      - score: 2
        label: "唐突な押し付け"
        description: "タイミングを誤った強いクロージング"
      - score: 3
        label: "弱いクロージング"
        description: "曖昧なクロージング"
      - score: 4
        label: "適切なタイミング"
        description: "会話の流れに沿ったクロージング"
      - score: 5
        label: "自然で効果的なクロージング"
        description: "顧客が納得できる自然なクロージング"

  # ディレクター向け評価項目
  - id: "hearing_skill"
    name: "ヒアリング力"
    description: "制作要件を丁寧に聞き出し、情報を整理する能力"
    levels:
      - score: 1
        label: "ヒアリング不足"
        description: "必要な情報を聞き出せていない"
      - score: 2
        label: "表面的なヒアリング"
        description: "基本的な質問のみで深掘りできていない"
      - score: 3
        label: "基本的なヒアリング"
        description: "目的・ターゲットなど基本情報は聞けている"
      - score: 4
        label: "網羅的なヒアリング"
        description: "必要な要件を網羅的に聞き出している"
      - score: 5
        label: "戦略的なヒアリング"
        description: "背景・真の課題まで引き出し、構造的に整理"

  - id: "planning_skill"
    name: "企画提案力"
    description: "クライアントの課題に対する具体的な解決策・方向性の提示"
    levels:
      - score: 1
        label: "提案なし"
        description: "方向性の示唆がない"
      - score: 2
        label: "抽象的な提案"
        description: "曖昧で具体性のない提案"
      - score: 3
        label: "基本的な提案"
        description: "一般的な解決策を提示"
      - score: 4
        label: "具体的な提案"
        description: "クライアントの課題に即した具体的な提案"
      - score: 5
        label: "戦略的な提案"
        description: "課題の本質を捉え、最適化された解決策を提示"

  - id: "director_communication_skill"
    name: "コミュニケーション力"
    description: "分かりやすい説明、共感、信頼関係の構築"
    levels:
      - score: 1
        label: "コミュニケーション不足"
        description: "専門用語が多く、説明が不十分"
      - score: 2
        label: "一方的な説明"
        description: "クライアント目線が欠けている"
      - score: 3
        label: "基本的な説明"
        description: "分かりやすい説明を心がけている"
      - score: 4
        label: "共感的なコミュニケーション"
        description: "相手の理解度を確認しながら丁寧に説明"
      - score: 5
        label: "信頼構築できる対話"
        description: "専門性と分かりやすさを両立し、安心感を提供"

  - id: "project_management_skill"
    name: "プロジェクト管理力"
    description: "納期・予算・工程の確認と調整能力"
    levels:
      - score: 1
        label: "管理視点なし"
        description: "スケジュール・予算の確認がない"
      - score: 2
        label: "形式的な確認"
        description: "聞くだけで具体性がない"
      - score: 3
        label: "基本的な確認"
        description: "納期・予算を確認している"
      - score: 4
        label: "具体的な工程提示"
        description: "スケジュール感を具体的に示している"
      - score: 5
        label: "柔軟な調整力"
        description: "制約条件を理解し、最適な工程を提案"

output_format:
  score_total: true
  score_average: true
  detailed_feedback: true
  improvement_suggestions: true
  next_steps: true

export_formats: ["JSON", "CSV", "PDF"]



